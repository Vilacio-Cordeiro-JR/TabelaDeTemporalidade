<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Temporalidade e Destinação de Documentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <h1 class="header__title">Tabela de Temporalidade</h1>
            
            <div class="header__controls">
                <div class="search-box">
                    <input type="search" id="searchInput" placeholder="Buscar por código, título, obs ou sinônimos..." aria-label="Buscar documentos">
                    <span id="searchStatus" class="search-status" aria-live="polite"></span>
                </div>

                <div class="seg" role="group" aria-label="Modo de visualização">
                    <button id="btnViewCascade" type="button" class="seg__btn is-active" aria-pressed="true">Cascata</button>
                    <button id="btnViewList" type="button" class="seg__btn" aria-pressed="false">Lista</button>
                    <button id="btnViewFav" type="button" class="seg__btn" aria-pressed="false">★ Favoritos</button>
                </div>
            </div>
        </div>
        <nav id="breadcrumbBar" class="breadcrumb" aria-label="Navegação em migalhas"></nav>
    </header>

    <main class="main-content">
        <div id="cascadeWrapper" class="cascade-wrapper"></div>
        <div id="listViewWrapper" class="list-wrapper" hidden></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
