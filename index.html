<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Temporalidade e Destinação de Documentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <header class="site-header">
            <div class="site-header__inner">
                <div class="brand">
                    <h1 class="brand__title">Sistema de Gestão Documental</h1>
                    <p class="brand__sub">Tabela de Temporalidade e Destinação de Documentos</p>
                </div>

                <div class="tools">
                    <div class="seg" role="group" aria-label="Modo de visualização">
                        <button id="btnViewCascade" type="button" class="seg__btn is-active" aria-pressed="true">Cascata</button>
                        <button id="btnViewList" type="button" class="seg__btn" aria-pressed="false">Lista</button>
                    </div>
                    <div class="search">
                        <input id="searchInput"
                               class="search__input"
                               type="search"
                               placeholder="Buscar por código ou descrição"
                               aria-label="Buscar por código ou descrição"
                               autocomplete="off">
                        <p id="searchStatus" class="search__status" role="status"></p>
                    </div>
                </div>
            </div>
        </header>

        <nav class="crumbs" aria-label="Trilha de navegação">
            <div id="breadcrumbBar" class="crumbs__inner"></div>
        </nav>

        <main class="main">
            <div id="cascadeWrapper" class="cascade"></div>
            <div id="listViewWrapper" class="listview" hidden></div>
        </main>

    </div>

    <script src="app.js"></script>
</body>
</html>
